# Local development database only. Credentials are for localhost use.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: printstudio
      POSTGRES_PASSWORD: printstudio
      POSTGRES_DB: printstudio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
